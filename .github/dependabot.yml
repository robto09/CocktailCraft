# Weekly dependency update PRs against dev.
#
# Gradle: Dependabot reads the version catalog only at
# gradle/libs.versions.toml (plus build.gradle(.kts) files), and also
# updates the Gradle wrapper. Related libraries are grouped so a week's
# updates arrive as a handful of PRs; a dependency matches the first group
# whose patterns fit it.
#
# Swift: the app's packages are resolved by the Xcode project (generated by
# XcodeGen from iosApp/project.yml). Dependabot updates the committed
# Package.resolved inside CocktailCraft.xcodeproj within the version rules
# in project.pbxproj; it never edits project.yml. A new major version (or
# DebugSwift, which is pinned to a commit) still needs a manual change to
# project.yml followed by `xcodegen generate`.
version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Kotlin, its compiler plugins, and the tools built against a specific
      # Kotlin version (SKIE, moko-resources) have to move together
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "co.touchlab.skie*"
          - "dev.icerock.*"
      android-gradle-plugin:
        patterns:
          - "com.android.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      androidx:
        patterns:
          - "androidx.*"
      ktor:
        patterns:
          - "io.ktor*"
      sqldelight:
        patterns:
          - "app.cash.sqldelight*"
      koin:
        patterns:
          - "io.insert-koin*"
      lint:
        patterns:
          - "dev.detekt*"
          - "io.nlopez.compose*"
      testing:
        patterns:
          - "junit*"
          - "org.junit*"
          - "io.mockk*"
          - "org.robolectric*"
          - "io.github.takahirom.roborazzi*"
          - "app.cash.turbine*"
      # Everything else: minor and patch updates together; majors stay
      # separate PRs so each gets its own review
      other-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "swift"
    directory: "/iosApp"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      swift-packages:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
