# Gradle
# Kotlin/Native compiles and links the iOS framework inside the Gradle daemon,
# and 2 GB is tight for a full link (SKIE + 6 exported modules). The Kotlin
# daemon (JVM/Android compiles) runs separately with its own heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Local build cache: reuses task outputs across branches/worktrees and clean builds
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
# Off by default in KGP; only matters once a module declares cinterops
kotlin.mpp.enableCInteropCommonization=true

# moko-resources: the shared framework is static, so the iOS app copies the
# strings bundle in itself (copyFrameworkResourcesToApp phase in project.yml)
moko.resources.disableStaticFrameworkWarning=true

# Single-source app version (AR-9/AN-12) — the one place the version is
# defined. androidApp reads these directly; iosApp/project.yml mirrors them via
# scripts/bump-version.sh (never edit the version in project.yml by hand).
appVersionName=0.4.0
appVersionCode=2

# Screenshot tests: plain test runs (testDebugUnitTest) verify against the
# committed baselines; re-record with ./gradlew recordRoborazziDebug.
roborazzi.test.verify=true
