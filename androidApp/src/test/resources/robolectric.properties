# Pinned so screenshot baselines don't shift with the Robolectric default.
# SDK 35+ android-all jars need a JDK 21 test runtime; the build uses JDK 17.
# (sdk cannot be combined with minSdk/maxSdk — Robolectric rejects the config.)
sdk=34
# Fixed phone-sized window for deterministic screenshots
qualifiers=w360dp-h640dp-xhdpi
